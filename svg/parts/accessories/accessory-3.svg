    .accent2 { fill: #3b82f6; stroke: none; }
    .accent2-stroke { stroke: #3b82f6; fill: none; }
    line.outline { fill: none; stroke: #1a1a1a; }
  </style>
  <g class="accessory">
    <circle class="accent" cx="150" cy="20" r="12"/>
   <rect class="outline" x="146" y="30" width="8" height="35" rx="2"/>
   <rect class="fill" x="130" y="62" width="40" height="15" rx="4"/>
  </g>
