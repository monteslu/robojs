<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <style>
    .outline { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 2; }
    .fill { fill: #ffffff; stroke: none; }
    .highlight { fill: #4ade80; opacity: 0.5; stroke: none; }
    .shadow { fill: #d1d5db; opacity: 0.4; stroke: none; }
    .neck { fill: #9ca3af; stroke: #6b7280; stroke-width: 2; }
    .rivet { fill: #1a1a1a; stroke: none; }
    .accent { fill: #ef4444; stroke: none; }
    .accent-stroke { stroke: #ef4444; fill: none; }
    .accent2 { fill: #3b82f6; stroke: none; }
    .accent2-stroke { stroke: #3b82f6; fill: none; }
    line.outline { fill: none; stroke: #1a1a1a; }
  </style>
  <!-- Head 8: Oval / egg shape, smooth vertical ellipse -->
  <g class="head">
    <ellipse class="outline" cx="150" cy="150" rx="90" ry="110"/>
    <ellipse class="fill" cx="150" cy="150" rx="82" ry="102"/>
    <ellipse class="highlight" cx="120" cy="110" rx="14" ry="30" transform="rotate(-10, 120, 110)"/>
    <circle class="highlight" cx="110" cy="145" r="5"/>
  </g>
</svg>
