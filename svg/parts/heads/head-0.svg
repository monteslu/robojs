    "/>
    <ellipse class="highlight" cx="115" cy="100" rx="15" ry="35" transform="rotate(-15, 115, 100)"/>
    <circle class="highlight" cx="103" cy="142" r="5"/>
    <circle class="rivet" cx="82" cy="58" r="3"/>
    <circle class="rivet" cx="104" cy="44" r="3"/>
