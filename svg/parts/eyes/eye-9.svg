    .accent2-stroke { stroke: #3b82f6; fill: none; }
    line.outline { fill: none; stroke: #1a1a1a; }
  </style>
  <g class="eye">
    <line class="accent-stroke" x1="105" y1="120" x2="135" y2="148" stroke-width="6"/>
   <line class="accent-stroke" x1="135" y1="120" x2="105" y2="148" stroke-width="6"/>
   <line class="accent-stroke" x1="170" y1="122" x2="196" y2="146" stroke-width="5"/>
   <line class="accent-stroke" x1="196" y1="122" x2="170" y2="146" stroke-width="5"/>
  </g>
