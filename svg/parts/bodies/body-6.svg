    .accent2 { fill: #3b82f6; stroke: none; }
    .accent2-stroke { stroke: #3b82f6; fill: none; }
    line.outline { fill: none; stroke: #1a1a1a; }
  </style>
  <g class="body">
    <rect class="outline" x="105" y="160" width="90" height="140" rx="12"/>
   <rect class="fill" x="113" y="168" width="74" height="128" rx="8"/>
   <rect class="neck" x="132" y="140" width="36" height="24" rx="5"/>
